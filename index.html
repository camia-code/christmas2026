<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>聖誕知識王</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- 分享圖：將成績卡片 DOM 轉成 PNG（本地引入，不依賴 CDN） -->
    <script src="js/vendor/html-to-image.js"></script>
  </head>
  <body>
    <!-- 背景音樂 -->
    <audio id="bgm" preload="none"></audio>
    <button id="bgm-toggle" class="bgm-toggle bgm-toggle--global" type="button" aria-label="背景音樂">🔊</button>


    <!-- 展示用切換列：給工程師時整段移除（連同 css 的 .demo-bar / .mock-toggle、main.js 的 mock-toggle 段落） -->
    <div id="demo-bar" class="demo-bar">
      <span>展示切換</span>
      <label class="demo-field demo-switch">
        <input type="checkbox" id="skip-toggle" />
        <span class="demo-switch-track" aria-hidden="true"></span>
        跳過答題
      </label>
      <select id="skip-score" class="demo-select" aria-label="跳過答題時的答對題數" hidden>
        <option value="random">答對題數：隨機</option>
        <option value="0">答對 0 題</option>
        <option value="1">答對 1 題</option>
        <option value="2">答對 2 題</option>
        <option value="3">答對 3 題</option>
        <option value="4">答對 4 題</option>
        <option value="5">答對 5 題</option>
        <option value="6">答對 6 題</option>
        <option value="7">答對 7 題</option>
        <option value="8">答對 8 題</option>
        <option value="9">答對 9 題</option>
        <option value="10">答對 10 題</option>
      </select>
      <label class="demo-field">語言 / Language
        <select id="lang-select" class="demo-select">
          <option value="tch">繁體中文</option>
          <option value="sch">简体中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <button id="mock-toggle" class="mock-toggle" type="button">身份: app</button>
    </div>

    <main id="app" class="app">
      <!-- 步驟1 歡迎頁 -->
      <section id="screen-welcome" class="screen"></section>

      <!-- 步驟2 答題頁 -->
      <section id="screen-play" class="screen hidden"></section>

      <!-- 活動辦法頁 -->
      <section id="screen-rules" class="screen hidden"></section>

      <!-- 步驟4 答題紀錄頁 -->
      <section id="screen-history" class="screen hidden"></section>
    </main>

    <!-- 步驟3 成績 modal -->
    <div id="result-modal" class="modal-overlay hidden"></div>

    <!-- 兌換序號 popup -->
    <div id="redeem-modal" class="modal-overlay modal-overlay--top hidden"></div>

    <!-- 分享卡片預覽 modal -->
    <div id="share-modal" class="modal-overlay hidden"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
